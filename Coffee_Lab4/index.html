<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Coffee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Coffee</h1>
    <p>Make a cup of coffee, then enjoy it.</p>

    <img id="coffeeImage" src="empty.jpg" alt="An empty glass">
    <h2 id="coffeeStatus">The cup is empty.</h2>
    <p id="message" aria-live="polite">Click Make Coffee to start.</p>

    <button type="button" onclick="makeCoffee()">Make Coffee</button>
    <button type="button" onclick="drinkCoffee()">Drink Coffee</button>

    <script src="script.js"></script>
</body>
</html>
